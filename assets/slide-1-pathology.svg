<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" fill="none" role="img" aria-label="Pathology and Blood Testing Laboratory at Odhav Diagnostics">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="900" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2F3F7"/>
      <stop offset="55%" stop-color="#F2FAF9"/>
      <stop offset="100%" stop-color="#DEF2EA"/>
    </linearGradient>
    <linearGradient id="bench1" x1="0" y1="390" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCECEF"/>
    </linearGradient>
    <linearGradient id="teal1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F768A"/>
      <stop offset="100%" stop-color="#0A4E5D"/>
    </linearGradient>
    <filter id="sh1" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A2E38" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="url(#bg1)"/>
  <!-- Soft window light rays -->
  <circle cx="760" cy="95" r="170" fill="#189A6C" fill-opacity="0.09"/>
  <circle cx="140" cy="110" r="130" fill="#0F768A" fill-opacity="0.08"/>

  <!-- Lab wall backsplash -->
  <rect x="60" y="64" width="780" height="330" rx="22" fill="#FFFFFF" fill-opacity="0.65" stroke="#D2E6EC" stroke-width="2"/>

  <!-- Lab bench surface -->
  <rect x="0" y="390" width="900" height="170" fill="url(#bench1)"/>
  <line x1="0" y1="390" x2="900" y2="390" stroke="#C5DDE3" stroke-width="3"/>

  <!-- Automated Hematology / Biochemistry Analyzer (Left-Center) -->
  <g filter="url(#sh1)">
    <rect x="115" y="138" width="290" height="252" rx="18" fill="#FFFFFF" stroke="#C8DFE6" stroke-width="2.5"/>
    <rect x="115" y="138" width="290" height="44" rx="18" fill="url(#teal1)"/>
    <rect x="115" y="164" width="290" height="18" fill="url(#teal1)"/>
    <circle cx="145" cy="160" r="6" fill="#34D399"/>
    <circle cx="166" cy="160" r="6" fill="#93C5FD"/>
    <!-- Analyzer touchscreen -->
    <rect x="142" y="200" width="144" height="96" rx="10" fill="#0A2E38"/>
    <rect x="154" y="214" width="76" height="8" rx="4" fill="#34D399"/>
    <rect x="154" y="232" width="116" height="8" rx="4" fill="#38BDF8" fill-opacity="0.7"/>
    <rect x="154" y="250" width="94" height="8" rx="4" fill="#34D399" fill-opacity="0.65"/>
    <rect x="154" y="268" width="60" height="12" rx="6" fill="#189A6C"/>
    <!-- Sample bay -->
    <rect x="304" y="200" width="78" height="156" rx="10" fill="#EFF7F9" stroke="#C8DFE6" stroke-width="2"/>
    <rect x="318" y="220" width="50" height="24" rx="6" fill="#0F768A" fill-opacity="0.16"/>
    <circle cx="343" cy="274" r="14" fill="#189A6C"/>
    <path d="M337 274 L341 278 L349 269" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Base vent -->
    <rect x="142" y="318" width="144" height="38" rx="8" fill="#F2F8FA" stroke="#D7E8ED" stroke-width="1.5"/>
  </g>

  <!-- Clinical Microscope (Center-Right) -->
  <g filter="url(#sh1)">
    <!-- Base -->
    <rect x="448" y="356" width="136" height="34" rx="10" fill="#133D48"/>
    <rect x="470" y="344" width="92" height="14" rx="5" fill="#0F768A"/>
    <!-- Arm -->
    <path d="M542 346 C566 300 568 232 536 184 L510 198 C532 238 532 292 512 346 Z" fill="#FFFFFF" stroke="#B7D2DA" stroke-width="2.5"/>
    <!-- Head & Eyepiece -->
    <rect x="476" y="156" width="66" height="44" rx="12" fill="#0F768A"/>
    <path d="M482 156 L462 114 L482 106 L502 152 Z" fill="#133D48"/>
    <ellipse cx="471" cy="108" rx="13" ry="6" transform="rotate(-22 471 108)" fill="#22B573"/>
    <!-- Objective turret & stage -->
    <rect x="486" y="200" width="38" height="24" rx="6" fill="#D5E8EE"/>
    <rect x="492" y="224" width="10" height="22" rx="3" fill="#0A2E38"/>
    <rect x="508" y="224" width="10" height="18" rx="3" fill="#189A6C"/>
    <rect x="458" y="268" width="84" height="12" rx="4" fill="#133D48"/>
    <!-- Glass slide -->
    <rect x="476" y="262" width="48" height="6" rx="2" fill="#93C5FD" fill-opacity="0.8"/>
    <!-- Stage light glow -->
    <ellipse cx="500" cy="296" rx="16" ry="7" fill="#34D399" fill-opacity="0.45"/>
  </g>

  <!-- Sample Collection Tube Rack (Far Right) -->
  <g filter="url(#sh1)">
    <!-- Rack frame -->
    <rect x="626" y="294" width="170" height="96" rx="10" fill="#FFFFFF" stroke="#B9D5DD" stroke-width="2.5"/>
    <rect x="626" y="294" width="170" height="14" rx="5" fill="#0F768A"/>
    <!-- 4 Blood Collection Vacutainer Tubes -->
    <!-- Tube 1: EDTA Purple -->
    <rect x="648" y="228" width="22" height="132" rx="11" fill="#F8FCFD" stroke="#B7D2DA" stroke-width="2"/>
    <rect x="651" y="274" width="16" height="78" rx="7" fill="#DC2626" fill-opacity="0.85"/>
    <rect x="645" y="214" width="28" height="20" rx="5" fill="#7C3AED"/>
    <!-- Tube 2: Serum Red -->
    <rect x="684" y="228" width="22" height="132" rx="11" fill="#F8FCFD" stroke="#B7D2DA" stroke-width="2"/>
    <rect x="687" y="284" width="16" height="68" rx="7" fill="#EF4444" fill-opacity="0.82"/>
    <rect x="681" y="214" width="28" height="20" rx="5" fill="#DC2626"/>
    <!-- Tube 3: Fluoride Grey -->
    <rect x="720" y="228" width="22" height="132" rx="11" fill="#F8FCFD" stroke="#B7D2DA" stroke-width="2"/>
    <rect x="723" y="292" width="16" height="60" rx="7" fill="#B91C1C" fill-opacity="0.78"/>
    <rect x="717" y="214" width="28" height="20" rx="5" fill="#475569"/>
    <!-- Tube 4: SST Gold/Teal -->
    <rect x="756" y="228" width="22" height="132" rx="11" fill="#F8FCFD" stroke="#B7D2DA" stroke-width="2"/>
    <rect x="759" y="278" width="16" height="74" rx="7" fill="#F59E0B" fill-opacity="0.55"/>
    <rect x="753" y="214" width="28" height="20" rx="5" fill="#189A6C"/>
    <!-- Front rack bar -->
    <rect x="626" y="346" width="170" height="14" rx="5" fill="#0F768A"/>
  </g>
</svg>
