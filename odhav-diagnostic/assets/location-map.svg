<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none" role="img" aria-label="Map showing Odhav Diagnostics on Koparli Road, Chhiri, Vapi opposite Dhanlaxmi Building">
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="640" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EBF5F7"/>
      <stop offset="100%" stop-color="#E5F3ED"/>
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0A2E38" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Land & blocks -->
  <rect width="640" height="300" fill="url(#mapBg)"/>
  <rect x="28" y="24" width="160" height="86" rx="12" fill="#DCECEF"/>
  <rect x="215" y="22" width="190" height="88" rx="12" fill="#DCECEF"/>
  <rect x="432" y="24" width="180" height="86" rx="12" fill="#DCECEF"/>
  <rect x="34" y="196" width="195" height="82" rx="12" fill="#D9ECE7"/>
  <rect x="255" y="196" width="175" height="82" rx="12" fill="#DCECEF"/>
  <rect x="456" y="196" width="156" height="82" rx="12" fill="#D9ECE7"/>

  <!-- Secondary streets -->
  <path d="M200 0 V300" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M442 0 V300" stroke="#FFFFFF" stroke-width="14"/>

  <!-- Main Koparli Road -->
  <path d="M0 152 Q210 144 380 152 T640 148" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  <path d="M0 152 Q210 144 380 152 T640 148" stroke="#F6C86E" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>

  <!-- Road Label -->
  <rect x="64" y="138" width="168" height="24" rx="12" fill="#0A2E38"/>
  <text x="148" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Koparli Rd · Chhiri, Vapi</text>

  <!-- Opposite landmark: Dhanlaxmi Building -->
  <rect x="275" y="198" width="145" height="38" rx="8" fill="#FFFFFF" stroke="#B9D2D9" stroke-width="1.5"/>
  <text x="347.5" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#35515B">Opp. Dhanlaxmi Building</text>
  <text x="347.5" y="229" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9.5" fill="#5D7780">Landmark</text>

  <!-- Chamunda Dream City Pin -->
  <g filter="url(#pinShadow)">
    <rect x="258" y="42" width="198" height="58" rx="12" fill="#FFFFFF" stroke="#0F768A" stroke-width="2"/>
    <text x="357" y="65" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#0E4250">Odhav Diagnostics</text>
    <text x="357" y="83" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#148F64">Shop 21, 1st Flr, Chamunda Dream City</text>
  </g>

  <!-- Map Marker -->
  <g filter="url(#pinShadow)">
    <path d="M357 148 C357 148 340 130 340 119 A17 17 0 1 1 374 119 C374 130 357 148 357 148 Z" fill="#0F768A"/>
    <circle cx="357" cy="119" r="6.5" fill="#FFFFFF"/>
  </g>

  <!-- Plus code chip -->
  <rect x="468" y="246" width="146" height="28" rx="8" fill="#0A2E38" fill-opacity="0.9"/>
  <text x="541" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Plus Code: 9WHP+F3</text>
</svg>
